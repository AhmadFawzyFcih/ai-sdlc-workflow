<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{THEME_CSS}}
.theme-toggle { position: fixed; top: 12px; right: 12px; z-index: 10; font-size: 16px; line-height: 1; padding: 6px 9px; }
</style>
</head>
<body>
<button class="btn theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle light/dark">◐</button>
<div class="layout">
  <nav class="nav" aria-label="Sections">
    <div class="nav-title">{{NAV_TITLE}}</div>
{{NAV_LINKS}}
  </nav>
  <main>
    <header class="hero">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
      <p class="lede">{{SUBTITLE}}</p>
      <div class="meta">{{META}}</div>
    </header>
{{BODY}}
    <div class="footer">Generated {{GENERATED_AT}} · backend plugin for Claude Code</div>
  </main>
</div>
<script>
function toggleTheme(){var r=document.documentElement,c=r.getAttribute('data-theme');var d=matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',(c?c==='dark':d)?'light':'dark');}
(function(){var links=[].slice.call(document.querySelectorAll('.nav a[href^="#"]'));if(!links.length||!('IntersectionObserver' in window))return;
var map={};links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a;});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.remove('active')});var a=map[e.target.id];if(a)a.classList.add('active');}})},{rootMargin:'0px 0px -70% 0px'});
Object.keys(map).forEach(function(id){var s=document.getElementById(id);if(s)io.observe(s);});})();
(function(){var boxes=document.querySelectorAll('input[type=checkbox][data-n]');var out=document.getElementById('selection-out');if(!boxes.length||!out)return;
function upd(){var n=[].slice.call(boxes).filter(function(b){return b.checked}).map(function(b){return '#'+b.dataset.n});out.textContent=n.length?'Selected: '+n.join(', '):'Nothing selected';}
boxes.forEach(function(b){b.addEventListener('change',upd)});upd();
var cp=document.getElementById('selection-copy');if(cp)cp.addEventListener('click',function(){navigator.clipboard&&navigator.clipboard.writeText(out.textContent);cp.textContent='Copied';setTimeout(function(){cp.textContent='Copy'},1200);});})();
</script>
{{MERMAID}}
</body>
</html>
