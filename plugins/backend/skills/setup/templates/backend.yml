# .claude/backend.yml — project config for the `backend` Claude Code plugin.
# Generated by /backend:setup. Safe to edit by hand. NEVER put secrets here.
version: 1

project:
  name: my-app                    # short name used in reports
  ruby: "3.3"
  rails: "7.1"
  description: ""                 # one line: what this app does (filled by setup or system-overview)

plans_dir: .plans                 # workspace root (see shared/workspace.md)

git:
  host: gitlab                    # gitlab | github
  cli: glab                       # glab | gh
  remote: origin
  base_branch: main               # where feature branches start and finally merge
  feature_branch_pattern: "feature/{key}-{slug}"
  subtask_branch_pattern: "{key}-{slug}"
  bugfix_branch_pattern: "bugfix/{key}-{slug}"
  merge_strategy: merge           # merge | squash | rebase — squash collapses split commits on the target
  commit_format: "{type}({key}): {summary}"   # conventional commits with the ticket key as scope
  draft_mrs: true
  auto_mr_comments: true          # post progress comments on MRs this workflow created, without asking each time

jira:
  site: ""                        # https://<site>.atlassian.net
  project_key: ""                 # e.g. PROJ
  subtask_issue_type: Sub-task
  ready_status: "Selected for Development"   # status/transition new subtasks are moved to
  in_progress_status: ""          # optional: move a subtask here when implementation starts (e.g. "In Progress")
  review_status: ""               # optional: move a subtask here when its MR is ready (e.g. "Code Review")
  copy_parent_labels: true
  assign_to_me: true
  reporter_me: true

confluence:
  space_key: ""
  default_folder_url: ""          # where new pages go unless told otherwise

figma:
  enabled: true

api:
  controllers_path: app/controllers/api
  versions: [v1]                  # e.g. [v1, v2]
  permissions_file: ""            # e.g. config/initializers/permissions.rb — leave empty if none
  serializers_path: app/serializers
  swagger:
    tool: rswag                   # rswag | none
    specs_path: spec/integration  # versions live under it: spec/integration/v1/...
    output_path: swagger
    generate_cmd: bundle exec rake rswag:specs:swaggerize

tests:
  cmd: bundle exec rspec
  factories: factory_bot          # factory_bot | fixtures

lint:
  rubocop: bundle exec rubocop    # empty string to disable
  brakeman: bundle exec brakeman -q --no-pager   # empty string to disable

background_jobs: sidekiq          # sidekiq | good_job | solid_queue | delayed_job | none
authorization: pundit             # pundit | cancancan | custom | none

app:
  local_url: http://localhost:3000
  test_login_hint: ""             # how to log in locally (e.g. "seed user from db/seeds.rb") — no passwords
  runner_cmd: bin/rails runner    # how to run Ruby against the local DB (e.g. "docker compose exec -T web bin/rails runner")

observability:
  errors: ""                      # sentry | bugsnag | rollbar | honeybadger | ""
  logs: ""                        # datadog | newrelic | kibana | ""
